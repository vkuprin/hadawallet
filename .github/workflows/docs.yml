name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Alire
        uses: alire-project/setup-alire@v3

      - name: Cache Alire toolchains and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/alire
            ~/.local/share/alire
            ~/.alire
          key: alire-${{ runner.os }}-${{ hashFiles('alire.toml', 'alire/alire.lock') }}
          restore-keys: |
            alire-${{ runner.os }}-

      - name: Install gnatdoc
        run: |
          alr -n install gnatdoc_bin
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Generate docs
        run: ./scripts/docs.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
