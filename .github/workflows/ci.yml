name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Alire
        uses: alire-project/setup-alire@v3

      - name: Cache Alire toolchains and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/alire
            ~/.local/share/alire
            ~/.alire
          key: alire-${{ runner.os }}-${{ hashFiles('alire.toml', 'alire/alire.lock') }}
          restore-keys: |
            alire-${{ runner.os }}-

      - name: Install gnatprove + gnatformat + gnatdoc + gnatcov
        run: |
          alr -n install gnatprove
          alr -n install gnatformat
          alr -n install gnatdoc_bin
          alr -n install gnatcov_bin
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Install lint helpers (shellcheck, actionlint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/

      - name: Setup Node (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Lint (gnatformat + style + shellcheck + actionlint + markdownlint)
        run: ./scripts/lint.sh

      - name: Build
        run: alr -n build

      - name: SPARK proof (level 1 baseline — runtime errors)
        run: alr -n exec -- gnatprove -P hadawallet.gpr --level=1 --report=fail
        # Baseline: no runtime errors anywhere. By week 4 this moves to
        # --level=4 and adds explicit assertion of the key-isolation flow
        # contract on Signing.Sign.

      - name: Smoke run
        run: ./bin/hadawallet
