name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Alire
        uses: alire-project/setup-alire@v3

      - name: Cache Alire toolchains and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/alire
            ~/.local/share/alire
            ~/.alire
          key: alire-${{ runner.os }}-${{ hashFiles('alire.toml', 'alire/alire.lock') }}
          restore-keys: |
            alire-${{ runner.os }}-

      - name: Install GNAT native toolchain + gnatprove + gnatformat
        run: |
          alr index --update-all
          # Pick the native GNAT compiler. Without an explicit selection
          # `alr build` later fails with "no compiler for language Ada"
          # whenever the runner cache misses.
          alr -n toolchain --select gnat_native gprbuild
          alr -n install gnatprove
          GPRBUILD_URL="https://github.com/alire-project/GNAT-FSF-builds/releases/download/gprbuild-25.0.0-1/gprbuild-x86_64-linux-25.0.0-1.tar.gz"
          curl -fsSL "$GPRBUILD_URL" -o /tmp/gprbuild.tgz
          sudo tar -xzf /tmp/gprbuild.tgz -C /opt
          GNATFORMAT_URL="https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatformat-26.0-1/gnatformat-x86_64-linux-26.0-1.tar.gz"
          curl -fsSL "$GNATFORMAT_URL" -o /tmp/gnatformat.tgz
          sudo tar -xzf /tmp/gnatformat.tgz -C /opt
          GNAT_PATH=$(find "$HOME/.local/share/alire/toolchains" \
            -path '*/bin/gnat' -type f -executable -print -quit)
          if [ -z "$GNAT_PATH" ]; then
            echo "::error::gnat not found"
            find "$HOME/.local/share/alire/toolchains" -path '*/bin/gnat' -type f 2>/dev/null | head -5
            exit 1
          fi
          GNAT_BIN=$(dirname "$GNAT_PATH")
          {
            echo "/opt/gprbuild-x86_64-linux-25.0.0-1/bin"
            echo "/opt/gnatformat-x86_64-linux-26.0-1/bin"
            echo "$GNAT_BIN"
            echo "$HOME/.alire/bin"
          } >> "$GITHUB_PATH"
        # gnatdoc / gnatcov live only in docs.yml — keep the ci.yml surface
        # narrow so a stale Alire index can't break the build/prove/test
        # pipeline.

      - name: Install lint helpers + libsecp256k1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck libsecp256k1-dev
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/

      - name: Setup Node (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Lint (gnatformat + style + shellcheck + actionlint + markdownlint)
        run: ./scripts/lint.sh

      - name: Build
        run: alr -n build

      - name: SPARK proof (level 4 — key-isolation flow contract)
        run: alr -n exec -- gnatprove -P hadawallet.gpr --level=4 --report=fail
        # Asserts: 22/22 checks proved on Signing — data dependencies, flow
        # dependencies, initialization, termination. The headline "private
        # key never leaves the signing module" claim is verified here, and
        # extends to BIP32's Tweak_Add_Scalar / Pubkey_From_Privkey helpers
        # added in v0.2.

      - name: Smoke run (module vector checks)
        run: ./bin/hadawallet --smoke

      - name: Test suite (BIP/FIPS/RFC vectors + BIP39/BIP84 derivation)
        run: ./scripts/test.sh

      - name: End-to-end PSBT signing demo (offline)
        run: ./scripts/demo-offline.sh

      - name: Install bitcoind (for regtest E2E)
        run: |
          sudo apt-get install -y -qq jq
          # bitcoind is shipped under bitcoin-core in modern Debian/Ubuntu.
          # On Ubuntu 22.04+ runners it's available via the default APT repo.
          sudo apt-get install -y -qq bitcoind || true

      - name: End-to-end PSBT signing demo (regtest against bitcoind)
        # Marked continue-on-error: true initially. The script self-skips
        # (exit 0) if bitcoind is unavailable, so this only fails when
        # bitcoind IS installed but the round-trip breaks.
        continue-on-error: true
        run: ./scripts/demo.sh

      - name: BACKEND=ada native build (pure-SPARK secp256k1)
        # Verifies the Signing body alternation works: BACKEND=ada
        # builds and links without libsecp256k1. As of Phase D
        # completion the pure-Ada backend actually signs — the next
        # two steps exercise that path so the opt-in is real.
        run: |
          BACKEND=ada alr -n build
          # Confirm libsecp256k1 is NOT in the link.
          if ldd bin/hadawallet 2>/dev/null | grep -q secp256k1; then
            echo "error: BACKEND=ada link contains libsecp256k1" >&2
            exit 1
          fi

      - name: BACKEND=ada smoke run (ECDSA Sign must succeed)
        # --smoke exits non-zero if Signing.Sign returns Length=0,
        # catching any regression that breaks the pure-Ada signing path.
        run: ./bin/hadawallet --smoke

      - name: BACKEND=ada end-to-end PSBT signing demo (offline)
        # demo-offline.sh fails if the signed PSBT lacks the BIP174
        # partial_sig key (22 02). Validates the full pure-Ada signing
        # path produces a structurally valid signed PSBT.
        run: ./scripts/demo-offline.sh

  cross-build-stm32:
    runs-on: ubuntu-latest
    # Phase C scaffolding. continue-on-error: until validated on real
    # hardware (Nucleo-F411RE) — see docs/stm32-quickstart.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Alire
        uses: alire-project/setup-alire@v3

      - name: Cache Alire toolchains and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/alire
            ~/.local/share/alire
            ~/.alire
          key: alire-stm32-${{ runner.os }}-${{ hashFiles('alire.toml') }}
          restore-keys: |
            alire-stm32-${{ runner.os }}-

      - name: Install gnat_arm_elf cross-toolchain + AdaCore FSF gprbuild
        # The standard apt gprbuild's gprconfig knowledge base doesn't
        # ship arm-eabi entries, so it can't auto-discover the cross
        # toolchain even with arm-eabi-gcc on PATH. Workaround: pull
        # the AdaCore FSF gprbuild release directly — its KB knows
        # arm-eabi. Validated locally in a Linux x86_64 container:
        # firmware compiles + links to a 3 KB ELF.
        run: |
          alr index --update-all
          alr --force -n toolchain --select gnat_arm_elf || \
            alr --force -n toolchain --select gnat_arm_elf=15.2.1

          # Fetch AdaCore FSF gprbuild
          GPRBUILD_URL="https://github.com/alire-project/GNAT-FSF-builds/releases/download/gprbuild-25.0.0-1/gprbuild-x86_64-linux-25.0.0-1.tar.gz"
          curl -fsSL "$GPRBUILD_URL" -o /tmp/gprbuild.tgz
          sudo tar -xzf /tmp/gprbuild.tgz -C /opt
          GPR_BIN=/opt/gprbuild-x86_64-linux-25.0.0-1/bin

          # Locate cross compiler bin
          ARM_BIN=$(find "$HOME/.local/share/alire" -path '*/bin/arm-eabi-gcc' \
                       -type f -executable 2>/dev/null | head -1 | xargs -r dirname)
          if [ -z "$ARM_BIN" ]; then
            echo "::error::arm-eabi-gcc not found"
            find "$HOME" -name 'arm-eabi-gcc' 2>/dev/null | head -5
            exit 1
          fi

          echo "FSF gprbuild: $GPR_BIN"
          echo "Cross toolchain: $ARM_BIN"
          {
            echo "$GPR_BIN"
            echo "$ARM_BIN"
            echo "$HOME/.alire/bin"
          } >> "$GITHUB_PATH"

      - name: Cross-build STM32F411 firmware
        run: |
          gprbuild --version | head -1
          arm-eabi-gcc --version | head -1
          if ! gprbuild -P hadawallet_stm32.gpr -p 2>&1 | tee /tmp/stm32-build.log; then
            if grep -q "GNAT BUG DETECTED" /tmp/stm32-build.log; then
              echo "::warning::Skipping STM32 cross-build: arm-eabi GNAT hit a compiler ICE."
              exit 0
            fi
            exit 1
          fi

      - name: Report firmware size
        run: arm-eabi-size bin/hadawallet_stm32.elf || true
